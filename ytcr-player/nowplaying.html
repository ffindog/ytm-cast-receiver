<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop - Now Playing</title>
<style>
  /* Pure black behind all text: the workshop TV puts a halo round light text on
     anything brighter than black (tested 2026-10-15, DVI input). */
  :root {
    --bg: #000;
    --panel: #000;
    --text: #f2f2f2;
    --muted: #9aa3ad;
    --accent: #ff3b3b;
    --track: #2a2f36;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: "DejaVu Sans", system-ui, sans-serif; overflow: hidden; cursor: none; }
  #clock { position: fixed; top: 3vh; right: 4vw; font-size: 4vh; color: var(--muted);
    font-variant-numeric: tabular-nums; z-index: 2; }
  #date { position: fixed; top: 3vh; left: 4vw; font-size: 4vh; color: var(--muted); z-index: 2; }
  .screen { position: relative; z-index: 1; height: 100%; display: none; }
  .screen.on { display: flex; }

  /* Playing */
  #playing { align-items: center; gap: 5vw; padding: 0 7vw; }
  #art { width: 62vh; height: 62vh; flex: none; border-radius: 2vh; object-fit: cover;
    background: var(--panel); }
  #info { flex: 1; min-width: 0; }
  #status-row { display: flex; align-items: center; gap: 2.5vh; margin-bottom: 2.5vh; }
  #status { font-size: 2.6vh; letter-spacing: .4vh; text-transform: uppercase; color: var(--accent); }
  /* Loop (repeat this song) is on: set from the control page or the remote. */
  #repeat { display: none; align-items: center; gap: .8vh; font-size: 2.6vh; letter-spacing: .4vh;
    text-transform: uppercase; color: #3fb950; }
  #repeat.on { display: inline-flex; }
  #repeat svg { width: 3.4vh; height: 3.4vh; fill: currentColor; }
  #title { font-size: 8vh; font-weight: bold; line-height: 1.1; margin-bottom: 2vh;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #artist { font-size: 4.5vh; color: var(--text); opacity: .9; margin-bottom: 1vh;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #album { font-size: 3.2vh; color: var(--muted); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  #progress { margin-top: 6vh; }
  #bar { height: 1.2vh; background: var(--track); border-radius: 1vh; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--accent); border-radius: 1vh; }
  #times { display: flex; justify-content: space-between; font-size: 2.8vh; color: var(--muted);
    margin-top: 1.5vh; font-variant-numeric: tabular-nums; }
  #playing.paused #fill { background: var(--muted); }

  /* Idle */
  #idle { flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #idle-clock { font-size: 22vh; font-weight: bold; font-variant-numeric: tabular-nums; }
  #idle-date { font-size: 4vh; color: var(--muted); margin-top: 1vh; }
  #idle-hint { font-size: 3.2vh; color: var(--muted); margin-top: 8vh; }
  #idle-hint b { color: var(--text); }
  body.idle #clock, body.idle #date { display: none; }

  /* Volume: shown for a few seconds after it changes. Black behind the text (see :root). */
  #volume { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); z-index: 3;
    display: flex; align-items: center; gap: 2.5vw; padding: 2vh 3vw; background: #000;
    border: .3vh solid var(--track); border-radius: 2vh; opacity: 0; transition: opacity .4s; }
  #volume.on { opacity: 1; transition: opacity .1s; }
  #vol-label { font-size: 3.6vh; color: var(--muted); }
  #vol-bar { width: 32vw; height: 1.6vh; background: var(--track); border-radius: 1vh; overflow: hidden; }
  #vol-fill { height: 100%; width: 0; background: var(--text); border-radius: 1vh; }
  #vol-pct { font-size: 4.5vh; font-weight: bold; min-width: 11vh; text-align: right;
    font-variant-numeric: tabular-nums; }
  #volume.muted #vol-fill { background: var(--muted); }
  img:not([src]) { visibility: hidden; } /* before the first poll */
</style>
</head>
<body class="idle">
<div id="date"></div>
<div id="clock"></div>

<section id="playing" class="screen">
  <img id="art" alt="">
  <div id="info">
    <div id="status-row"><span id="status">Now playing</span><span id="repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>Repeat</span></div>
    <div id="title"></div>
    <div id="artist"></div>
    <div id="album"></div>
    <div id="progress">
      <div id="bar"><div id="fill"></div></div>
      <div id="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    </div>
  </div>
</section>

<section id="idle" class="screen on">
  <div id="idle-clock"></div>
  <div id="idle-date"></div>
  <div id="idle-hint">Cast from YouTube Music to <b>Workshop</b></div>
</section>

<div id="volume">
  <div id="vol-label">Volume</div>
  <div id="vol-bar"><div id="vol-fill"></div></div>
  <div id="vol-pct"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (s) => {
    s = Math.max(0, Math.floor(s || 0));
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
  };

  // Position is interpolated between polls so the bar moves smoothly.
  let last = null;
  let lastAt = 0;
  // Shown when there is no artwork (an <img> with no picture is a broken tile).
  const NO_ART = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">'
    + '<rect width="24" height="24" fill="#14171b"/>'
    + '<path transform="translate(6 5.5) scale(.5)" fill="#3a4048" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>');
  let artUrl;
  // Between tracks the receiver briefly reports stopped/loading with no track.
  // Keep the last track up ("Loading next...") for this long before standby.
  const HOLD_MS = 10000;
  let activeAt = 0;
  let shown = false;

  function clock() {
    const now = new Date();
    const t = now.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
    $('clock').textContent = t;
    $('idle-clock').textContent = t;
    // "Sat 17 Oct" (built by hand: browsers' short formats vary, e.g. "Sept", commas).
    $('date').textContent = `${'Sun Mon Tue Wed Thu Fri Sat'.split(' ')[now.getDay()]} ${now.getDate()} `
      + 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')[now.getMonth()];
    $('idle-date').textContent = now.toLocaleDateString('en-AU',
      { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function render() {
    clock();
    const s = last;
    const live = !!(s && s.state !== 'idle' && s.track);
    if (live) activeAt = Date.now();
    const holding = !live && shown && Date.now() - activeAt < HOLD_MS;
    const active = live || holding;
    document.body.classList.toggle('idle', !active);
    $('playing').classList.toggle('on', active);
    $('idle').classList.toggle('on', !active);
    if (!active) return;
    if (holding) {
      $('playing').classList.add('paused');
      $('status').textContent = 'Loading next…';
      // Show the song that is coming (its art is already preloaded).
      if (upNext) {
        showTrack(upNext);
        $('fill').style.width = '0';
        $('pos').textContent = $('dur').textContent = '0:00';
      }
      return;
    }
    const paused = s.state === 'paused';
    $('repeat').classList.toggle('on', !!s.loop);
    $('playing').classList.toggle('paused', paused);
    $('status').textContent = paused ? 'Paused' : 'Now playing';
    const pos = paused ? s.position : s.position + (Date.now() - lastAt) / 1000;
    const dur = s.duration || 0;
    $('pos').textContent = fmt(Math.min(pos, dur || pos));
    $('dur').textContent = fmt(dur);
    $('fill').style.width = dur ? `${Math.min(100, (pos / dur) * 100)}%` : '0';
  }

  // Volume pops up when it changes (not on first load), then fades.
  let volKey = null;
  let volTimer = null;
  function showVolume(v) {
    if (!v) return;
    const key = `${v.level}/${v.muted}`;
    if (key === volKey) return;
    const first = volKey === null;
    volKey = key;
    if (first) return;
    $('volume').classList.toggle('muted', !!v.muted);
    $('vol-fill').style.width = `${v.muted ? 0 : v.level}%`;
    $('vol-pct').textContent = v.muted ? 'Muted' : `${v.level}%`;
    $('volume').classList.add('on');
    clearTimeout(volTimer);
    volTimer = setTimeout(() => $('volume').classList.remove('on'), 3000);
  }

  const preload = new Image();
  let upNext = null; // the next song, as last reported while one was playing
  function showTrack(t) {
    $('title').textContent = t.title || '';
    $('artist').textContent = t.artist || '';
    $('album').textContent = t.album || '';
    const art = t.thumbnail || null;
    if (art !== artUrl) {
      artUrl = art;
      $('art').src = art || NO_ART;
    }
  }
  async function poll() {
    try {
      const res = await fetch('/api/now-playing', { cache: 'no-store' });
      const s = await res.json();
      last = s;
      lastAt = Date.now();
      showVolume(s.volume);
      if (s.track) {
        shown = true;
        showTrack(s.track);
        upNext = s.next || null;
      }
      // Fetch the next song's art ahead so it shows straight away.
      if (s.next?.thumbnail && s.next.thumbnail !== preload.src) preload.src = s.next.thumbnail;
    }
    catch {
      last = null;
    }
    render();
  }

  poll();
  setInterval(poll, 1000);
  setInterval(render, 250);
</script>
</body>
</html>
